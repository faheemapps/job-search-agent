# ---------------------------------------------------------------------------
# SCORING ENGINE (0-100 base score; combo/recency bonuses layered on top for
# ranking order only — see scoring.py)
# ---------------------------------------------------------------------------
scoring:
  core_technology:               # max 50
    snowflake: 15
    informatica: 10               # powercenter OR idmc
    oracle_plsql: 8
    ms_fabric_azure: 7
    airflow: 5
    python_sql_etl_dw: 5          # python, sql, etl, or data warehouse generic terms
  seniority:                      # max 15
    manager_architect: 15
    lead_senior: 12
    mid_level: 6
    junior: 0
  experience:                     # max 10
    "15_plus": 10
    "10_14": 7
    "7_9": 5
    below_7: 2
  remote:                         # max 15
    india_confirmed: 15
    global_remote: 15
    unclear: 8
    hybrid: 3
    onsite: 0
  salary:                         # max 10
    very_high: 10
    high: 8
    average: 5
    low: 2
    not_disclosed: 4
  bonuses:                        # added on top for ranking (not part of /100 display score)
    snowflake_informatica_plsql: 5
    snowflake_fabric_airflow: 5
    india_remote_high_salary: 5
    recency:
      tier1_24h: 10
      tier2_3d: 6
      tier3_7d: 3
      tier4_14d: 1
      unverified_or_older: 0

# ---------------------------------------------------------------------------
# SALARY TIER THRESHOLDS (annualized, gross). Add currencies as needed.
# ---------------------------------------------------------------------------
salary_thresholds:
  INR:
    very_high: 5500000
    high: 4000000
    average: 2200000
  USD:
    very_high: 190000
    high: 150000
    average: 100000
  AED:
    very_high: 550000
    high: 420000
    average: 260000
  GBP:
    very_high: 140000
    high: 100000
    average: 65000
  EUR:
    very_high: 150000
    high: 110000
    average: 70000

# ---------------------------------------------------------------------------
# RECENCY TIERS (hours since posting_date; requires a verifiable date)
# ---------------------------------------------------------------------------
recency_tiers:
  tier1_hours: 24
  tier2_hours: 72
  tier3_hours: 168
  tier4_hours: 336

# ---------------------------------------------------------------------------
# DEDUPLICATION
# ---------------------------------------------------------------------------
dedup:
  title_similarity_threshold: 0.82
  description_similarity_threshold: 0.80
  canonical_url_priority: source_priority_order   # see above

# ---------------------------------------------------------------------------
# ALERTS
# ---------------------------------------------------------------------------
alerts:
  rules:
    - name: excellent_india_remote
      condition: "score >= 85 and india_remote in ['REMOTE_INDIA_CONFIRMED']"
    - name: exceptional_score
      condition: "score >= 90"
    - name: core_stack_high_salary
      condition: "has_snowflake and has_informatica and has_plsql and salary_meets_target"

# ---------------------------------------------------------------------------
# APPLICATION AUTOMATION (must stay false unless explicitly enabled by the
# candidate; the agent only recommends jobs by default)
# ---------------------------------------------------------------------------
auto_apply_enabled: false
