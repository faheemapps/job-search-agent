# =============================================================================
# JOB SEARCH CONFIGURATION
# Controls search behavior, scoring weights, thresholds, sources, and
# scheduling. Change any value here without touching source code.
# =============================================================================

run:
  jobs_per_source_per_query: 15   # how many results to pull per query per source
  max_jobs_in_report: 20          # "TOP 20 JOBS" table size
  score_threshold_for_report: 40  # jobs below this score are stored but not reported
  search_frequency: daily         # daily | twice_daily | weekly
  daily_run_time_ist: "08:00"

# ---------------------------------------------------------------------------
# SOURCES
# type: api        -> real no-auth-required JSON API, called directly by the
#                      Python connector (fully automatable, no Claude needed)
# type: mcp_tool    -> pulled via a Claude-side MCP tool during a live run
#                      (Indeed / Dice / ZipRecruiter). Cannot run headless
#                      without Claude in the loop today.
# type: ai_search   -> no public API and scraping is disallowed by ToS /
#                      robots.txt for most of these; a Claude session performs
#                      WebSearch/WebFetch (search-engine snippets and, where a
#                      site's robots.txt permits it, direct page fetches) and
#                      writes results into data/raw/ using the standard
#                      ingestion schema. Disable a source by setting enabled: false.
# ---------------------------------------------------------------------------
sources:
  - name: Remotive
    type: api
    enabled: true
    priority: 5
  - name: RemoteOK
    type: api
    enabled: true
    priority: 5
  - name: Arbeitnow
    type: api
    enabled: true
    priority: 5
  - name: Jobicy
    type: api
    enabled: true
    priority: 5
  - name: WeWorkRemotely
    type: api
    enabled: true
    priority: 5
  - name: Himalayas
    type: api
    enabled: true
    priority: 5
  - name: Indeed
    type: mcp_tool
    enabled: true
    priority: 3
  - name: Dice
    type: mcp_tool
    enabled: true
    priority: 5
  - name: ZipRecruiter
    type: mcp_tool
    enabled: true
    priority: 5
  - name: LinkedIn
    type: ai_search
    enabled: true
    priority: 2
    notes: "No public search API; LinkedIn's robots.txt disallows automated /jobs scraping. Use WebSearch snippets only."
  - name: Naukri
    type: ai_search
    enabled: true
    priority: 4
  - name: NaukriGulf
    type: ai_search
    enabled: true
    priority: 4
  - name: Glassdoor
    type: ai_search
    enabled: true
    priority: 6
  - name: Bayt
    type: ai_search
    enabled: true
    priority: 6
  - name: Foundit
    type: ai_search
    enabled: true
    priority: 6
  - name: Wellfound
    type: ai_search
    enabled: true
    priority: 6
  - name: Instahyre
    type: ai_search
    enabled: true
    priority: 4
  - name: CompanyCareerPage
    type: ai_search
    enabled: true
    priority: 1
  - name: GoogleWebSearch
    type: ai_search
    enabled: true
    priority: 7

# ---------------------------------------------------------------------------
# SOURCE RELIABILITY (lower number = more trusted; used to resolve conflicts
# and to pick the canonical URL during deduplication)
# ---------------------------------------------------------------------------
source_priority_order:
  - CompanyCareerPage
  - LinkedIn
  - Indeed
  - Naukri
  - NaukriGulf
  - Dice
  - ZipRecruiter
  - Instahyre
  - Glassdoor
  - Bayt
  - Foundit
  - Wellfound
  - Remotive
  - RemoteOK
  - Arbeitnow
  - Jobicy
  - WeWorkRemotely
  - Himalayas
  - GoogleWebSearch

# ---------------------------------------------------------------------------
# SEED SEARCH QUERIES (Search Query Generator seeds from this list, then
# expands dynamically with terminology discovered in matched job titles)
# ---------------------------------------------------------------------------
seed_queries:
  - "Snowflake Informatica PowerCenter remote Data Engineer"
  - "Snowflake PL/SQL remote Data Engineer"
  - "Snowflake Informatica PL/SQL remote"
  - "Snowflake Airflow remote Data Engineer"
  - "Snowflake Microsoft Fabric remote Data Engineer"
  - "Snowflake Informatica Airflow"
  - "Informatica PowerCenter Snowflake Senior Data Engineer"
  - "Snowflake Oracle PL/SQL Data Architect"
  - "Snowflake ETL Architect remote"
  - "Snowflake Data Engineering Manager remote"
  - "Microsoft Fabric Snowflake Airflow remote"
  - "Snowflake Azure ADLS Informatica"
  - "Snowflake Developer remote India"
  - "Data Warehouse Architect remote Snowflake"

# Terms auto-discovered from job titles get appended here at runtime by the
# query generator (data/discovered_terms.json), then merged into future runs.
discovered_terms_file: data/discovered_terms.json

