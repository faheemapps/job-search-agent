name: Job Search (free-API sources, every 4h)

# Runs the fully-headless connectors (Remotive, RemoteOK, Arbeitnow, Jobicy,
# Himalayas) with no Claude/API keys required, commits the updated SQLite DB
# and markdown report back to the repo, and uploads the report as a build
# artifact. Entirely free: GitHub Actions minutes on a public repo + no-auth
# public JSON APIs. Only covers the subset of sources that have free public
# APIs.
#
# LinkedIn, Naukri, Naukri Gulf, Glassdoor, Bayt, Foundit, Wellfound,
# Instahyre, company career pages, and Indeed/Dice/ZipRecruiter have no
# public search APIs and require WebSearch / MCP tools that only exist
# inside a Claude session (see README.md section 4b) — that coverage is not
# free and is intentionally not run on this schedule.

on:
  schedule:
    # every 4 hours, anchored to 7:30 IST (02:00 UTC): 7:30/11:30/15:30/
    # 19:30/23:30/3:30 IST
    - cron: "0 2,6,10,14,18,22 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  search:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run free-API job search
        run: python3 main.py run-free-apis --limit 20

      - name: Generate report
        run: |
          python3 main.py report --out "reports/$(date +%F).md"
          python3 main.py report

      - name: Upload report artifact
        uses: actions/upload-artifact@v4
        with:
          name: job-search-report
          path: reports/

      - name: Commit updated DB + report
        run: |
          git config user.name "job-search-agent"
          git config user.email "actions@users.noreply.github.com"
          git add db/jobs.db reports/ data/discovered_terms.json || true
          git diff --cached --quiet || git commit -m "Job search run $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
