name: Daily Job Search (free-API sources)

# Runs the fully-headless connectors (Remotive, RemoteOK, Arbeitnow, Jobicy,
# Himalayas) with no Claude/API keys required, commits the updated SQLite DB
# and markdown report back to the repo, and uploads the report as a build
# artifact. This covers the subset of sources that have free public APIs.
#
# For full coverage (LinkedIn, Naukri, Naukri Gulf, Glassdoor, Bayt, Foundit,
# Wellfound, Instahyre, company career pages, Indeed/Dice/ZipRecruiter) see
# README.md -> "Full-coverage daily run via a Claude scheduled task", since
# those sources require WebSearch / MCP tools that only exist inside a
# Claude session.

on:
  schedule:
    # 08:00 IST = 02:30 UTC
    - cron: "30 2 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  search:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run free-API job search
        run: python3 main.py run-free-apis --limit 20

      - name: Generate report
        run: python3 main.py report --out "reports/$(date +%F).md"

      - name: Upload report artifact
        uses: actions/upload-artifact@v4
        with:
          name: job-search-report
          path: reports/

      - name: Commit updated DB + report
        run: |
          git config user.name "job-search-agent"
          git config user.email "actions@users.noreply.github.com"
          git add db/jobs.db reports/ data/discovered_terms.json || true
          git diff --cached --quiet || git commit -m "Daily job search run $(date +%F)"
          git push
